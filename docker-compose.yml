# Entorno local: infraestructura, API, web y worker de extracción de documentos.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: talentos
      # Valores del DSN de ejemplo del SDD 17.2; no son credenciales reales.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talentos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env.example
    environment:
      # Overrides locales: dentro de Compose los servicios se alcanzan por nombre.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/talentos
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./apps/api:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker/Dockerfile
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--beat", "--loglevel=info"]
    # Sin secretos en el repo: valores de ejemplo y, si existe, .env local no versionado.
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/talentos
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: mock
      LOG_LEVEL: INFO
    volumes:
      # Storage local compartido con la API: bind de ./apps/api incluye var/documents.
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
    environment:
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
