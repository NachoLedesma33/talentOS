# Entorno local de Fase 1: solo infraestructura y API.
# `web` y `worker` se agregan en unidades posteriores: sus imágenes aún no existen.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: talentos
      # Valores del DSN de ejemplo del SDD 17.2; no son credenciales reales.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talentos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env.example
    environment:
      # Overrides locales: dentro de Compose los servicios se alcanzan por nombre.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/talentos
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./apps/api:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
