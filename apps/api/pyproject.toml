[build-system]
requires = ["setuptools>=68"] # Backend de build para instalación editable; no se importa en runtime.
build-backend = "setuptools.build_meta"

[project]
name = "talentos-api"
version = "0.1.0"
description = "API FastAPI de TalentOS — fundación Fase 1."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",          # Framework HTTP, enrutamiento y OpenAPI de la API.
    "uvicorn>=0.30,<1",           # Servidor ASGI para ejecución local.
    "pydantic>=2.7,<3",           # Contratos tipados y validación de entrada/salida.
    "pydantic-settings>=2.3,<3",  # Settings tipados leídos desde variables de entorno.
    # Dependencias nuevas de la unidad 2 (Fase 1): justificación exigida por AGENTS.md.
    "sqlalchemy>=2,<3",           # ORM 2.x: sesiones y metadata de persistencia; dominio y repositorios lo usarán sin SQL libre.
    "alembic>=1.13,<2",           # Migraciones versionadas y reversibles del esquema (criterio de Fase 1).
    "psycopg[binary]>=3.1,<4",    # Driver exigido por el DSN local `postgresql+psycopg` documentado en SDD 17.2.
    "bcrypt>=4,<6",               # Hash de contraseñas con coste ajustable; nunca texto plano en DB.
    "email-validator>=2,<3",      # Requerido por Pydantic EmailStr para validar emails de entrada.
    "python-multipart>=0.0.9,<1",  # Fase 4 unidad 2: FastAPI necesita parser multipart para UploadFile en POST /upload.
    # Dependencias nuevas de la unidad 3 (Fase 4): extracción determinista y ejecución en background; sin LLM.
    "pypdf>=5",                   # Extrae texto y páginas de PDF desde bytes privados, sin servicio externo.
    "python-docx>=1",             # Extrae párrafos de DOCX con la misma interfaz determinista.
    "celery>=5.4,<6",             # Cola/worker con Redis para procesar documentos fuera del request HTTP.
    # Unidad 4 (Fase 4): el adaptador LLM remoto es código de runtime y usa httpx.Client.
    "httpx>=0.28,<1",             # Cliente HTTP del proveedor remoto; antes solo estaba en dev para TestClient.
    # Unidad 1 (Fase 6): ADR-006 elige LangGraph para grafos con estado, checkpoints y aprobación humana.
    "langgraph>=1.2.24,<2",       # API verificada en Python 3.12: StateGraph, BaseCheckpointSaver e interrupt.
    # Unidad 1 (Fase 9): ADR-013 elige cryptography/Fernet para cifrar configs sensibles en reposo sin crypto casera.
    "cryptography>=44,<45",       # Fernet AEAD mantenido y listo para uso: cifrado autenticado de secrets por organización.
]

[project.optional-dependencies]
# `dev` agrupa las herramientas de calidad; README instala `apps/api[dev]`.
dev = [
    "pytest>=8,<10",              # Ejecución de tests unitarios y de API.
    "ruff>=0.6,<1",               # Lint y orden de imports de Python.
    "mypy>=1.10,<2",              # Chequeo estático de tipos del backend.
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
pretty = true
