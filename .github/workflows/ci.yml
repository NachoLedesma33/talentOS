name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret pattern scan
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI \
            -e 'AKIA[0-9A-Z]{16}' \
            -e '(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}' \
            -e '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' \
            -e 'xox[baprs]-[A-Za-z0-9-]{10,}' \
            -e 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}' \
            -- .; then
            echo "::error::Possible secret found in tracked files"
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talentos
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d talentos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Valores locales del SDD 17.2; no son credenciales de ningún entorno real.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/talentos
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install
        run: |
          python -m venv "$RUNNER_TEMP/app-venv"
          "$RUNNER_TEMP/app-venv/bin/python" -m pip install --quiet --upgrade pip setuptools
          "$RUNNER_TEMP/app-venv/bin/python" -m pip install --quiet -e "apps/api[dev]"
      - name: Dependency audit
        run: |
          python -m venv "$RUNNER_TEMP/audit-venv"
          "$RUNNER_TEMP/audit-venv/bin/python" -m pip install --quiet pip-audit
          "$RUNNER_TEMP/app-venv/bin/python" -m pip freeze | grep -v '^-e' > "$RUNNER_TEMP/requirements.txt"
          "$RUNNER_TEMP/audit-venv/bin/python" -m pip_audit --requirement "$RUNNER_TEMP/requirements.txt"
      - name: Ruff
        working-directory: apps/api
        run: >-
          "$RUNNER_TEMP/app-venv/bin/python" -m ruff check .
      - name: Mypy
        working-directory: apps/api
        run: >-
          "$RUNNER_TEMP/app-venv/bin/python" -m mypy app
      - name: Pytest
        working-directory: apps/api
        run: >-
          "$RUNNER_TEMP/app-venv/bin/python" -m pytest -q
      - name: Alembic
        working-directory: apps/api
        run: |
          "$RUNNER_TEMP/app-venv/bin/alembic" upgrade head
          "$RUNNER_TEMP/app-venv/bin/alembic" check

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Dependency audit
        working-directory: apps/web
        run: npm audit --audit-level=high
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Unit tests
        working-directory: apps/web
        run: npm test
      - name: Build
        working-directory: apps/web
        run: npm run build
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        working-directory: apps/web
        run: npm run test:e2e

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
